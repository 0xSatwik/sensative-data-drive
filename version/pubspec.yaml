name: sensative_data_drive
description: "A secure Flutter mobile application for detailed data management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  dio: ^5.4.1
  
  # Security
  flutter_secure_storage: ^8.0.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  local_auth: ^2.1.8
  
  # Routing
  go_router: ^13.2.0
  
  # UI & Utilities
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  version: any
flutter:
  uses-material-design: true
